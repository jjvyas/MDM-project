    document.addEventListener("DOMContentLoaded", function () {
      const searchInput = document.getElementById("gameSearch");
      const categoryItems = document.querySelectorAll(".category-item");
      const noGamesFound = document.getElementById("noGamesFound");
      const gamesGrid = document.getElementById("gamesGrid");

      // Dynamic Navbar Authentication state toggler
      const isLoggedIn = sessionStorage.getItem("isLoggedIn") === "true";
      const navRegisterItem = document.getElementById("navRegisterItem");
      const navProfileItem = document.getElementById("navProfileItem");
      const navSignOutItem = document.getElementById("navSignOutItem");

      if (isLoggedIn) {
        if (navRegisterItem) navRegisterItem.style.setProperty("display", "none", "important");
        if (navProfileItem) navProfileItem.style.setProperty("display", "block", "important");
        if (navSignOutItem) navSignOutItem.style.setProperty("display", "block", "important");
      } else {
        if (navRegisterItem) navRegisterItem.style.setProperty("display", "block", "important");
        if (navProfileItem) navProfileItem.style.setProperty("display", "none", "important");
        if (navSignOutItem) navSignOutItem.style.setProperty("display", "none", "important");
      }

      const signOutBtn = document.getElementById("signOutBtn");
      if (signOutBtn) {
        signOutBtn.addEventListener("click", function (e) {
          e.preventDefault();
          sessionStorage.clear();
          window.location.href = "index.html";
        });
      }

      let currentCategory = "all";
      let searchQuery = "";
      let allGamesData = [];

      // Fetch games from MySQL via server API
      fetch("http://localhost:5000/api/games")
        .then(res => res.json())
        .then(games => {
          allGamesData = games;
          renderGamesGrid();
        })
        .catch(err => {
          console.error("Error loading games:", err);
          gamesGrid.innerHTML = `<div class="glass-card p-4 text-center w-100"><p class="text-danger mb-0">Failed to load games from database. Check backend connection.</p></div>`;
        });

      function renderGamesGrid() {
        gamesGrid.innerHTML = "";
        let visibleCount = 0;

        allGamesData.forEach(game => {
          const details = gameDetailsMap[game.title] || {
            image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&auto=format&fit=crop",
            category: game.platform || "Action",
            categories: ["action"],
            desc: "Immersive high-performance visual experience standard title."
          };

          const matchesCategory = currentCategory === "all" || details.categories.includes(currentCategory);
          const matchesSearch = game.title.toLowerCase().includes(searchQuery) || details.desc.toLowerCase().includes(searchQuery);

          if (matchesCategory && matchesSearch) {
            visibleCount++;
            const cardEl = document.createElement("article");
            cardEl.className = "game-card glass-card";
            cardEl.innerHTML = `
              <div class="game-img-container">
                <img src="${details.image}" alt="${game.title}">
                <span class="game-category-tag">${details.category}</span>
              </div>
              <div class="game-card-body">
                <h4 class="game-title">${game.title}</h4>
                <p class="game-desc">${details.desc}</p>
                <div class="game-footer">
                  <span class="game-price">₹${parseFloat(game.price).toLocaleString('en-IN')}</span>
                  <button class="btn-buy" onclick="addGlobalCartItem(${game.game_id}, '${game.title.replace(/'/g, "\\'")}', ${game.price}, '${details.image}')">Add to Cart</button>
                </div>
              </div>
            `;
            gamesGrid.appendChild(cardEl);
          }
        });

        if (visibleCount === 0) {
          noGamesFound.classList.remove("d-none");
        } else {
          noGamesFound.classList.add("d-none");
        }
      }

      // Search typing listener
      searchInput.addEventListener("input", function (e) {
        searchQuery = e.target.value.toLowerCase().trim();
        renderGamesGrid();
      });

      // Category click listener
      categoryItems.forEach(item => {
        item.addEventListener("click", function () {
          categoryItems.forEach(c => c.classList.remove("active"));
          item.classList.add("active");
          currentCategory = item.getAttribute("data-category");
          renderGamesGrid();
        });
      });
    });

    // Global Shopping Cart Controller
    document.addEventListener("DOMContentLoaded", function () {
      const isLoggedIn = sessionStorage.getItem("isLoggedIn") === "true";
      if (!isLoggedIn) return;

      // 1. Dynamically inject Cart Drawer HTML to body
      const drawerHtml = `
        <div class="cart-drawer-overlay" id="cartDrawerOverlay">
          <div class="cart-drawer" id="cartDrawer">
            <div class="cart-header">
              <h4 class="cart-title">SHOPPING CART</h4>
              <button class="cart-close-btn" id="cartCloseBtn">&times;</button>
            </div>
            <div class="cart-items-container" id="cartItemsList">
              <!-- Populated dynamically -->
            </div>
            <div class="cart-footer">
              <div class="cart-summary-line">
                <span>Subtotal</span>
                <span id="cartSubtotal">₹0.00</span>
              </div>
              <div class="cart-summary-line">
                <span>GST (18%)</span>
                <span id="cartTax">₹0.00</span>
              </div>
              <div class="cart-total-line">
                <span>Grand Total</span>
                <span id="cartGrandTotal">₹0.00</span>
              </div>
              <button class="btn btn-checkout mt-2" id="cartCheckoutBtn">PROCEED TO CHECKOUT</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML("beforeend", drawerHtml);

      // 2. Initialize Cart State
      let cart = JSON.parse(sessionStorage.getItem("cart")) || [];

      // 3. UI Selectors
      const overlay = document.getElementById("cartDrawerOverlay");
      const drawer = document.getElementById("cartDrawer");
      const closeBtn = document.getElementById("cartCloseBtn");
      const checkoutBtn = document.getElementById("cartCheckoutBtn");
      const itemsList = document.getElementById("cartItemsList");
      const cartToggleBtn = document.getElementById("cartToggleBtn");
      const cartBadgeCount = document.getElementById("cartBadgeCount");
      const subtotalEl = document.getElementById("cartSubtotal");
      const taxEl = document.getElementById("cartTax");
      const totalEl = document.getElementById("cartGrandTotal");
      const navCartItem = document.getElementById("navCartItem");

      // Show Cart Icon in navbar
      if (navCartItem) navCartItem.style.setProperty("display", "block", "important");

      // Toggle Drawer
      function toggleCartDrawer() {
        overlay.classList.toggle("active");
      }

      if (cartToggleBtn) cartToggleBtn.addEventListener("click", (e) => { e.preventDefault(); toggleCartDrawer(); });
      if (closeBtn) closeBtn.addEventListener("click", toggleCartDrawer);
      if (overlay) overlay.addEventListener("click", (e) => { if (e.target === overlay) toggleCartDrawer(); });

      // Render Cart Items
      window.renderGlobalCart = function() {
        itemsList.innerHTML = "";
        let subtotal = 0;

        if (cart.length === 0) {
          itemsList.innerHTML = `<div class="empty-state">YOUR CART IS EMPTY.<br><small>Add some epic game CDs to start playing!</small></div>`;
          checkoutBtn.setAttribute("disabled", "true");
        } else {
          checkoutBtn.removeAttribute("disabled");
          cart.forEach((item, index) => {
            subtotal += parseFloat(item.price);
            const itemEl = document.createElement("div");
            itemEl.className = "cart-item";
            itemEl.innerHTML = `
              <img src="${item.image}" class="cart-item-img" alt="${item.title}">
              <div class="cart-item-details">
                <h5 class="cart-item-title">${item.title}</h5>
                <p class="cart-item-price">₹${parseFloat(item.price).toLocaleString('en-IN')}</p>
              </div>
              <button class="cart-item-remove" onclick="removeGlobalCartItem(${index})">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">
                  <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
                </svg>
              </button>
            `;
            itemsList.appendChild(itemEl);
          });
        }

        // Update Totals
        const gst = subtotal * 0.18;
        const grandTotal = subtotal + gst;

        if (cartBadgeCount) cartBadgeCount.textContent = cart.length;
        subtotalEl.textContent = `₹${subtotal.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
        taxEl.textContent = `₹${gst.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
        totalEl.textContent = `₹${grandTotal.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
      };

      window.removeGlobalCartItem = function(index) {
        cart.splice(index, 1);
        sessionStorage.setItem("cart", JSON.stringify(cart));
        renderGlobalCart();
      };

      window.addGlobalCartItem = function(gameId, title, price, image) {
        cart.push({ gameId, title, price, image });
        sessionStorage.setItem("cart", JSON.stringify(cart));
        renderGlobalCart();
        overlay.classList.add("active");
      };

      // Checkout handler
      checkoutBtn.addEventListener("click", function () {
        const userId = sessionStorage.getItem("userId");
        const toast = document.getElementById("toastNotification");
        const toastMsg = document.getElementById("toastMessage");

        if (!userId) return;

        checkoutBtn.setAttribute("disabled", "true");
        checkoutBtn.textContent = "CHECKING OUT...";

        fetch("http://localhost:5000/api/purchase-cart", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ userId, cart })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            toast.className = "premium-toast success active glass-card";
            toast.style.borderColor = "#8f00ff";
            toastMsg.innerHTML = `🛒 <strong>Purchase Successful!</strong> Checked out <strong>${cart.length}</strong> games successfully! Check your dossier history.`;
            
            // Clear cart
            cart = [];
            sessionStorage.setItem("cart", JSON.stringify(cart));
            renderGlobalCart();
            overlay.classList.remove("active");
          } else {
            toast.className = "premium-toast error active glass-card";
            toastMsg.textContent = data.message || "Failed to checkout cart.";
          }
          checkoutBtn.removeAttribute("disabled");
          checkoutBtn.textContent = "PROCEED TO CHECKOUT";
          setTimeout(() => toast.classList.remove("active"), 4500);
        })
        .catch(err => {
          console.error("Cart Checkout Error:", err);
          toast.className = "premium-toast error active glass-card";
          toastMsg.textContent = "Network error. Make sure your server is running.";
          checkoutBtn.removeAttribute("disabled");
          checkoutBtn.textContent = "PROCEED TO CHECKOUT";
          setTimeout(() => toast.classList.remove("active"), 3500);
        });
      });

      // Initial Render
      renderGlobalCart();
    });
  </script>
</body>
</html>
