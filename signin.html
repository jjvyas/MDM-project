<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In - BOOKMYGAME</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Russo+One&family=Share+Tech+Mono&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/STYLES.CSS">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .form-box {
      margin-top: 0 !important;
    }
    .form-control {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #fff !important;
      border-radius: 8px !important;
      padding: 11px 15px !important;
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.1) !important;
      border-color: #8f00ff !important;
      box-shadow: 0 0 10px rgba(143, 0, 255, 0.25) !important;
      outline: none !important;
    }
    .form-label {
      color: rgba(255, 255, 255, 0.8) !important;
      font-weight: 500;
      font-size: 0.9rem;
    }
    a {
      color: #8f00ff !important;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Full Screen Background Video -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="bg-video.mp4" type="video/mp4">
  </video>

  <!-- Elegant Home Button at top-left -->
  <div style="position: absolute; top: 25px; left: 25px;">
    <a href="index.html" class="btn btn-outline-warning rounded-pill px-4" style="border-color: rgba(143, 0, 255, 0.5); color: #8f00ff !important;">
      ← Home
    </a>
  </div>

  <div class="form-box glass-card p-4 p-md-5" style="width: 100%; max-width: 480px;">
    <div class="text-center mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 50" width="60" height="48" style="vertical-align: middle;">
            <rect x="5" y="5" width="13" height="40" fill="#5c00a3" />
            <line x1="5" y1="10" x2="18" y2="23" stroke="#2d0052" stroke-width="1.5" />
            <line x1="5" y1="15" x2="18" y2="28" stroke="#2d0052" stroke-width="1.5" />
            <line x1="5" y1="20" x2="18" y2="33" stroke="#2d0052" stroke-width="1.5" />
            <line x1="5" y1="35" x2="10" y2="40" stroke="#2d0052" stroke-width="1.5" />
            <line x1="13" y1="5" x2="18" y2="10" stroke="#2d0052" stroke-width="1.5" />
            <text x="21" y="41" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="44" fill="#e8d0b5" stroke="#1c1618" stroke-width="1.5" letter-spacing="-1">B</text>
            <text x="17" y="39" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="44" fill="#ffffff" stroke="#1c1618" stroke-width="1.5" letter-spacing="-1">B</text>
        </svg>
    </div>
    <h3 class="text-center mb-4" style="color: #fff; font-weight: 700; letter-spacing: 1px; font-family: 'Orbitron', sans-serif;">Welcome Back</h3>

    <!-- Dynamic Warning Banner for Guard redirects -->
    <div id="authAlert" class="auth-msg-banner d-none">
      <strong>Authentication Required!</strong> Please register or sign in to your account first to access the Games and Booking sections.
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">E-mail Address</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-register w-100">Sign In</button>
    </form>

    <p class="text-center mt-4 mb-0 text-white-50">
      Don't have an account? <a id="registerLink" href="register.html">Register</a>
    </p>
  </div>

  <!-- Dynamic Success/Error Toast notification -->
  <div id="toastNotification" class="premium-toast glass-card">
    <span id="toastMessage"></span>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      const isAuthRequired = urlParams.get("message") === "auth_required";
      const redirectDest = urlParams.get("redirect") || "games.html";
      
      // Show auth warning if redirected
      if (isAuthRequired) {
        const authAlert = document.getElementById("authAlert");
        authAlert.classList.remove("d-none");
      }

      // Propagate original redirect parameter to registration link
      const registerLink = document.getElementById("registerLink");
      registerLink.href = `register.html?redirect=${encodeURIComponent(redirectDest)}${isAuthRequired ? '&message=auth_required' : ''}`;

      // Handle Submission
      const form = document.getElementById("loginForm");
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        const toast = document.getElementById("toastNotification");
        const toastMsg = document.getElementById("toastMessage");

        fetch("http://localhost:5000/api/signin", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            // Save auth state & user details
            sessionStorage.setItem("isLoggedIn", "true");
            sessionStorage.setItem("userId", data.user.userId);
            sessionStorage.setItem("userName", data.user.name);
            sessionStorage.setItem("userEmail", data.user.email);
            sessionStorage.setItem("userPhone", data.user.phone);

            toast.className = "premium-toast success active glass-card";
            toastMsg.textContent = "Sign-in Successful! Welcoming you back...";

            setTimeout(() => {
              window.location.href = redirectDest;
            }, 1500);
          } else {
            toast.className = "premium-toast error active glass-card";
            toast.style.borderColor = "#ff4d4d";
            toastMsg.textContent = data.message || "Invalid email or password.";
            setTimeout(() => toast.classList.remove("active"), 3000);
          }
        })
        .catch(err => {
          console.error("Sign-in Fetch Error:", err);
          toast.className = "premium-toast error active glass-card";
          toast.style.borderColor = "#ff4d4d";
          toastMsg.textContent = "Network error. Make sure your server is running.";
          setTimeout(() => toast.classList.remove("active"), 3000);
        });
      });
    });
  </script>
</body>
</html>
